[project]
name = "travel-mcp"
version = "0.1.0"
description = "Travel MCP servers: reward flights (Seats.aero), Google Flights, and Google Maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Travel MCP" }]
keywords = ["mcp", "travel", "flights", "maps", "seats-aero"]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fast-flights>=2.1",
    "googlemaps>=4.10.0",
    "google-maps-places>=0.7.0",
    "google-maps-routing>=0.6.0",
]

[project.scripts]
travel-seats = "travel_seats.server:main"
travel-flights = "travel_flights.server:main"
travel-maps = "travel_maps.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_common", "src/travel_seats", "src/travel_flights", "src/travel_maps"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["travel_common", "travel_seats", "travel_flights", "travel_maps"]
